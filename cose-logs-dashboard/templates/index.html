<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs Monitoring</title>

<style>

:root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #374151;
    --muted: #6b7280;
    --accent: #4779b8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 14px;
}

header {
    padding: 20px 30px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 22px;
    color: #273449;
}

.muted {
    color: var(--muted);
}

main {
    max-width: 1450px;
    margin: auto;
    padding: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 18px;
}

.card, .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
}

.card {
    padding: 18px;
}

.card span {
    color: var(--muted);
}

.num {
    font-size: 27px;
    font-weight: bold;
    margin-top: 10px;
    color: #273449;
}

.filters {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr 1.3fr auto auto;
    gap: 10px;
    padding: 15px;
    margin-bottom: 18px;
}

input, select, button {
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    color: var(--text);
    font-size: 14px;
}

button {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    cursor: pointer;
}

button:hover {
    background: #35669f;
}

.secondary {
    background: #ffffff;
    color: #374151;
    border-color: var(--border);
}

.secondary:hover {
    background: #f0f1f3;
}

.toolbar {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    color: var(--muted);
}

.tablewrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
}

th {
    color: #4b5563;
    background: #f9fafb;
}

tr:hover td {
    background: #f8fafc;
}

.msg {
    max-width: 350px;
    overflow-wrap: anywhere;
}

.pill {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    background: #f3f4f6;
    font-size: 12px;
    font-weight: bold;
}

.INFO {
    color: #374151;
    background: #f3f4f6;
}

.WARN {
    color: #8a641d;
    background: #fff8e7;
}

.ERROR {
    color: #a33b3b;
    background: #fff0f0;
}

.DEBUG {
    color: #4779b8;
    background: #edf4fc;
}

.link {
    background: none;
    border: none;
    color: var(--accent);
    padding: 0;
    cursor: pointer;
}

.empty, .err {
    text-align: center;
    padding: 25px;
    color: var(--muted);
}

.err {
    color: #a33b3b;
}

dialog {
    width: min(850px, 94vw);
    max-height: 85vh;
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
}

dialog::backdrop {
    background: rgba(0,0,0,0.4);
}

pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #f5f6f8;
    padding: 15px;
    border-radius: 6px;
}

@media(max-width: 850px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width: 520px) {
    .cards, .filters {
        grid-template-columns: 1fr;
    }

    main {
        padding: 12px;
    }

    header {
        padding: 16px;
    }
}

</style>
</head>

<body>

<header>
    <div>
        <h1>Logs Monitoring</h1>
    </div>
    <div class="muted" id="connection">Connexion</div>
</header>

<main>

    <!-- STATISTIQUES -->
    <section class="cards">

        <div class="card">
            <span>Documents chargés</span>
            <div class="num" id="total">:</div>
        </div>

        <div class="card">
            <span>Services détectés</span>
            <div class="num" id="services">:</div>
        </div>

        <div class="card">
            <span>Logs ERROR</span>
            <div class="num" id="errors">:</div>
        </div>

        <div class="card">
            <span>Logs WARN</span>
            <div class="num" id="warns">:</div>
        </div>

    </section>

    <!-- FILTRES -->
    <section class="panel filters">

        <input id="q" placeholder="Rechercher un événement">

        <select id="service">
            <option value="">Tous les services</option>
            <option>order-service</option>
            <option>inventory-service</option>
            <option>customer-service</option>
            <option>payment-service</option>
            <option>shipping-service</option>
            <option>notification-service</option>
        </select>

        <select id="level">
            <option value="">Tous les niveaux</option>
            <option>INFO</option>
            <option>WARN</option>
            <option>ERROR</option>
            <option>DEBUG</option>
        </select>

        <input id="cid" placeholder="Correlation ID">

        <button id="search">Rechercher</button>
        <button class="secondary" id="reset">Réinitialiser</button>

    </section>

    <!-- TABLEAU DES LOGS -->
    <section class="panel">

        <div class="toolbar">

            <span id="count">Chargement...</span>

            <label>
                <input type="checkbox" id="auto" checked
                       style="min-width:auto">
                Actualisation automatique chaque 15 s
            </label>

        </div>

        <div class="tablewrap">

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Service</th>
                        <th>Niveau</th>
                        <th>Événement</th>
                        <th>Message</th>
                        <th>Correlation ID</th>
                        <th>Détails</th>
                    </tr>
                </thead>

                <tbody id="rows">
                    <tr>
                        <td colspan="7" class="empty">
                            Chargement des logs...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

        <div class="err" id="err" hidden></div>

    </section>

</main>

<!-- FENÊTRE JSON -->
<dialog id="dlg">

    <h3>Détail du log JSON</h3>

    <pre id="json"></pre>

    <button class="secondary" id="close">Fermer</button>

</dialog>

<script>

const $ = id => document.getElementById(id);

let timer;
window.docs = [];

const esc = value =>
    String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[c]));

const fmt = value => {
    if (!value) return "—";

    const date = new Date(value);

    return isNaN(date)
        ? esc(value)
        : date.toLocaleString();
};

// STATISTIQUES
async function stats() {

    try {

        const response = await fetch("/api/stats");
        const data = await response.json();

        if (!response.ok) throw Error(data.error);

        $("total").textContent = data.loaded_documents;
        $("services").textContent = data.services;
        $("errors").textContent = data.levels.ERROR || 0;
        $("warns").textContent = data.levels.WARN || 0;

        $("connection").textContent = "Elasticsearch connecté";

    } catch (error) {

        $("connection").textContent = "Elasticsearch indisponible";

    }
}

// CHARGEMENT DES LOGS
async function logs() {

    const params = new URLSearchParams({
        q: $("q").value,
        service: $("service").value,
        level: $("level").value,
        correlation_id: $("cid").value,
        limit: 100
    });

    $("err").hidden = true;

    try {

        const response = await fetch("/api/logs?" + params);
        const data = await response.json();

        if (!response.ok) throw Error(data.error);

        $("count").textContent =
            data.total + " résultats et " +
            data.logs.length + " affichés";

        window.docs = data.logs;

        $("rows").innerHTML = data.logs.length

            ? data.logs.map((log, index) => `
                <tr>
                    <td>${fmt(log.timestamp)}</td>
                    <td>${esc(log.service)}</td>
                    <td>
                        <span class="pill ${esc(String(log.level).toUpperCase())}">
                            ${esc(log.level)}
                        </span>
                    </td>
                    <td>${esc(log.event)}</td>
                    <td class="msg">${esc(log.message)}</td>
                    <td>${esc(log.correlation_id)}</td>
                    <td>
                        <button class="link" data-i="${index}">
                            Voir JSON
                        </button>
                    </td>
                </tr>
            `).join("")

            : `<tr>
                <td colspan="7" class="empty">
                    Aucun log trouvé.
                </td>
               </tr>`;

        document.querySelectorAll("[data-i]").forEach(button => {

            button.onclick = () => {

                const index = Number(button.dataset.i);

                $("json").textContent = JSON.stringify(
                    window.docs[index].raw,
                    null,
                    2
                );

                $("dlg").showModal();

            };

        });

    } catch (error) {

        $("rows").innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Chargement impossible
                </td>
            </tr>
        `;

        $("err").hidden = false;
        $("err").textContent = error.message;

    }
}

// ACTUALISATION
function refresh() {
    stats();
    logs();
}

// BOUTONS
$("search").onclick = logs;

$("reset").onclick = () => {

    $("q").value = "";
    $("cid").value = "";
    $("service").value = "";
    $("level").value = "";

    refresh();

};

$("close").onclick = () => $("dlg").close();

// ACTUALISATION AUTOMATIQUE
function updateTimer() {

    clearInterval(timer);

    if ($("auto").checked) {
        timer = setInterval(refresh, 15000);
    }

}

$("auto").onchange = updateTimer;

// RECHERCHE AVEC ENTER
["q", "cid"].forEach(id => {

    $(id).addEventListener("keydown", event => {

        if (event.key === "Enter") logs();

    });

});

// DÉMARRAGE
refresh();
updateTimer();

</script>

</body>
</html>
