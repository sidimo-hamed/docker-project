

services:

  gateway:
    image: nginx:1.27-alpine
    container_name: apiGateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - microServices
    depends_on:
      - order-service
      - customer-service
      - inventory-service

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8081:8080"
    environment:
      ORDER_URL: "http://order-service:5000"
      INVENTORY_URL: "http://inventory-service:5001"
      CUSTOMER_URL: "http://customer-service:5002"
      PAYMENT_URL: "http://payment-service:5003"
      SHIPPING_URL: "http://shipping-service:5004"
      NOTIFICATION_URL: "http://notification-service:5005"
    networks:
      - microServices

  order-service:
    build: ./orderService
    image: serviceorder:latest
    container_name: orderService
    ports:
      - "5000:5000"
    environment:
      SERVICE_NAME: "order-service"
      ENABLE_CB_TEST: "false"
      # CB_TEST_TOKEN: "${CB_TEST_TOKEN}"
      DATABASE_URL: "postgresql+psycopg://sidimed:p%40ssword@postgresBD:5432/orders_db"
      CUSTOMER_URL: "http://customer-service:5002"
      INVENTORY_URL: "http://inventory-service:5001"
      PAYMENT_URL: "http://payment-service:5003"
      SHIPPING_URL: "http://shipping-service:5004"
      NOTIFICATION_URL: "http://notification-service:5005"
    networks:
      - microServices

  inventory-service:
    build: ./inventoryService
    image: serviceinventory:latest
    container_name: inventoryService
    ports:
      - "5001:5001"
    environment:
      SERVICE_NAME: "inventory-service"
      DATABASE_URL: "postgresql+psycopg://sidimed:p%40ssword@postgresBD:5432/inventory_db"
    networks:
      - microServices

  customer-service:
    build: ./customer-service
    image: servicecustomer:latest
    container_name: customerService
    ports:
      - "5002:5002"
    environment:
      SERVICE_NAME: "customer-service"
      DATABASE_URL: "postgresql+psycopg://sidimed:p%40ssword@postgresBD:5432/customers_db"
    networks:
      - microServices

  payment-service:
    build: ./paymentService
    container_name: paymentService
    ports:
      - "5003:5003"
    environment:
      SERVICE_NAME: "payment-service"
    networks:
      - microServices

  shipping-service:
    build: ./shippingService
    container_name: shippingService
    ports:
      - "5004:5004"
    environment:
      SERVICE_NAME: "shipping-service"
    networks:
      - microServices

  notification-service:
    build: ./notificationService
    container_name: notificationService
    ports:
      - "5005:5005"
    environment:
      SERVICE_NAME: "notification-service"
    networks:
      - microServices

  auth-service:
    build: ./authService
    container_name: authService
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - microServices

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - microServices
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - microServices
    depends_on:
      - prometheus
    restart: unless-stopped

  
  logs-dashboard:
    build:
      context: ./cose-logs-dashboard
      dockerfile: Dockerfile
    container_name: logsDashboard
    ports:
      - "8082:5000"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: microservices-logs-*
    restart: unless-stopped
    networks:
      - microServices

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elk/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - microServices
    mem_limit: 1g
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    ports:
      - "5006:5006"
    volumes:
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./elk/logstash/config/jvm.options:/usr/share/logstash/config/jvm.options:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    networks:
      - microServices
    depends_on:
      - elasticsearch
    mem_limit: 512m
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    ports:
      - "5601:5601"
    volumes:
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    networks:
      - microServices
    depends_on:
      - elasticsearch
    mem_limit: 768m
    restart: unless-stopped


volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  microServices:
    external: true
