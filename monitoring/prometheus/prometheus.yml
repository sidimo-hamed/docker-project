
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Fichier contenant les règles d'alerte
rule_files:
  - "alert_rules.yml"

scrape_configs:

  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "order-service:5000"

  - job_name: "inventory-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["inventoryService:5001"]

  - job_name: "customer-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["customerService:5002"]

  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["paymentService:5003"]

  - job_name: "shipping-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["shippingService:5004"]

  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notificationService:5005"]
